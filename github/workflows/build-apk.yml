
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Verificar ZIP
        run: |
          if [ ! -f "noxo.zip" ]; then
            echo "ERRO: noxo.zip nao encontrado na raiz!"
            exit 1
          fi

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto ZIP
        run: |
          mkdir -p extracted
          unzip -q noxo.zip -d extracted

      - name: Encontrar projeto Android
        id: project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Gradle nao encontrado no ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            assembleDebug

      - name: Verificar APK
        run: |
          find "${{ steps.project.outputs.dir }}" \
            -name "*.apk" -type f

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-COMPLETO
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
